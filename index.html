<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケモンバトル図鑑</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>ポケモンバトル図鑑</h1>

    <div class="battle-arena" id="battleArena">
      <div class="loading-overlay hidden" id="loading">
        <div class="pokeball">
          <div class="pokeball-top"></div>
          <div class="pokeball-center"></div>
          <div class="pokeball-bottom"></div>
        </div>
        <p>対戦相手を選出中...</p>
      </div>

      <div class="pokemon-card hidden" id="card1"></div>
      <div class="vs-badge" id="vsBadge">VS</div>
      <div class="pokemon-card hidden" id="card2"></div>
    </div>

    <button class="battle-btn" id="battleBtn">&#9654; 新しいバトル</button>
  </div>

  <!-- Evolution Tree Modal -->
  <div class="modal-overlay hidden" id="evoModal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="evoModalTitle">進化ツリー</h2>
        <button class="modal-close" id="evoModalClose">&#10005;</button>
      </div>
      <div class="modal-body">
        <div id="evoTree"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
